name: CNBC Radio Auto Recorder

on:
  schedule:
    - cron: '30 18 * * *' # รันตี 1:30 ทุกวัน (เวลาไทย)
  workflow_dispatch:

jobs:
  record_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools & Dependencies
        run: |
          pip install yt-dlp selenium webdriver-manager requests google-genai edge-tts
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg

      - name: Run Recorder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python recorder.py

      - name: Install Rclone
        run: |
          sudo apt-get install -y rclone

      - name: Setup Rclone and Upload
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          
          # 📁 กำหนดชื่อโฟลเดอร์ตามวันที่ไทย เช่น CNBC/2026-08-21
          TARGET_FOLDER="CNBC/$(TZ='Asia/Bangkok' date +'%Y-%m-%d')"
          
          echo "=== กำลังย้ายไฟล์ทั้งหมดเข้าโฟลเดอร์: $TARGET_FOLDER ==="
          
          # ย้ายไฟล์ทั้งหมดเข้าโฟลเดอร์ประจำวันใน Google Drive
          rclone move ./ "mydrive:$TARGET_FOLDER" --include "*.mp3" --include "*.txt" --verbose
