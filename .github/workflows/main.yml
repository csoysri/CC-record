name: CNBC Radio Auto Recorder

on:
  schedule:
    - cron: '0 19 * * *' # รันตี 2 ทุกวัน
  workflow_dispatch:

jobs:
  record_and_upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tools & Dependencies
        run: |
          pip install yt-dlp selenium webdriver-manager requests google-genai
          sudo apt-get update
          sudo apt-get install -y chromium-browser ffmpeg

      - name: Run Recorder Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python recorder.py

      - name: Install Rclone
        run: |
          sudo apt-get install -y rclone

      - name: Setup Rclone and Upload
        env:
          RCLONE_CONF_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF_DATA" > ~/.config/rclone/rclone.conf
          
          echo "=== ตรวจสอบไฟล์ทั้งหมดที่จะอัปโหลด ==="
          ls -lh
          
          # ย้ายทั้งไฟล์ .mp3 และไฟล์สรุป .txt ขึ้น Google Drive
          rclone move ./ mydrive: --include "*.mp3" --include "*.txt" --verbose
